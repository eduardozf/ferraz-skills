name: Validate skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Agent Skills validator
        run: python -m pip install skills-ref==0.1.1

      - name: Validate design consistency review
        run: agentskills validate skills/design-consistency-review

      - name: Check skills.sh discovery
        run: npx --yes skills add . --list
